services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sentinelayer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql/rls.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  risk-engine:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -q -r requirements.txt && PYTHONPATH=/app python -m uvicorn engine.risk.server:app --host 0.0.0.0 --port 8090"
    environment:
      PYTHONPATH: /app
    ports:
      - "8090:8090"
    depends_on:
      - redis

  control-plane:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -q -r requirements.txt &&
             PYTHONPATH=/app python -c 'from control_plane.app.bootstrap_db import ensure_schema; ensure_schema()' &&
             (PYTHONPATH=/app alembic -c alembic.ini upgrade head || true) &&
             PYTHONPATH=/app python -m uvicorn control_plane.app.main:app --host 0.0.0.0 --port 8005"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sentinelayer
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-me-in-production-min-32-chars-xx
      SL_ENV: development
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_URL: http://control-plane:8005
      RISK_ENGINE_URL: http://risk-engine:8090
      REDIS_URL: redis://redis:6379/0
      SL_ENV: development
      SL_ENFORCE_PROVENANCE: "false"
    depends_on:
      - redis
      - risk-engine
      - control-plane

volumes:
  postgres_data:
