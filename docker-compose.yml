services:
  postgres:
    image: postgres:15
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: sentinelayer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/sql/rls.sql:/docker-entrypoint-initdb.d/02-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  risk-engine:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -q -r requirements.txt && PYTHONPATH=/app python -m uvicorn engine.risk.server:app --host 0.0.0.0 --port 8090"
    environment:
      PYTHONPATH: /app
    ports:
      - "8090:8090"
    depends_on:
      - redis

  control-plane:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -q -r requirements.txt &&
             PYTHONPATH=/app alembic -c alembic.ini upgrade head &&
             PYTHONPATH=/app python -m uvicorn control_plane.app.main:app --host 0.0.0.0 --port 8005"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SL_ENV: development
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  maintenance-worker:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
      - backup_data:/app/backups
    command: >
      sh -c "pip install -q -r requirements.txt &&
             PYTHONPATH=/app python -m control_plane.app.workers.runner --loop"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-300}
      WORKER_LOCK_PATH: /tmp/sentinelayer-maintenance.lock
      BACKUP_DIR: /app/backups
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_started

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_URL: http://control-plane:8005
      RISK_ENGINE_URL: http://risk-engine:8090
      REDIS_URL: redis://redis:6379/0
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SL_ENV: development
      SL_ENFORCE_PROVENANCE: "false"
      SL_APPROVED_ARTIFACT_HASH: ""
      SL_RUNNING_ARTIFACT_HASH: ""
    depends_on:
      - redis
      - risk-engine
      - control-plane

volumes:
  postgres_data:
  backup_data:
