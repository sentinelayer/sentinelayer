services:
  - type: web
    name: sentinelayer
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn src.sentinelayer.api.main_full:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: JWT_SECRET_KEY
        generateValue: true
