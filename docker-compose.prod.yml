# Usage:
#   HASH=$(sha256sum dist/gateway | awk '{print $1}')
#   SL_APPROVED_ARTIFACT_HASH=$HASH SL_RUNNING_ARTIFACT_HASH=$HASH \
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  gateway:
    environment:
      SL_ENFORCE_PROVENANCE: "true"
      SL_APPROVED_ARTIFACT_HASH: ${SL_APPROVED_ARTIFACT_HASH:?set SL_APPROVED_ARTIFACT_HASH}
      SL_RUNNING_ARTIFACT_HASH: ${SL_RUNNING_ARTIFACT_HASH:?set SL_RUNNING_ARTIFACT_HASH}
      SL_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      KMS_KEY: ${KMS_KEY:?set KMS_KEY}
    restart: unless-stopped

  control-plane:
    environment:
      SL_ENV: production
      SL_AUTO_CREATE_SCHEMA: "0"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      KMS_KEY: ${KMS_KEY:?set KMS_KEY}
    restart: unless-stopped

  maintenance-worker:
    environment:
      SL_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      KMS_KEY: ${KMS_KEY:?set KMS_KEY}
      WEBHOOK_DELIVERY_MAX_ATTEMPTS: ${WEBHOOK_DELIVERY_MAX_ATTEMPTS:-5}
      WEBHOOK_DELIVERY_TIMEOUT_SECONDS: ${WEBHOOK_DELIVERY_TIMEOUT_SECONDS:-5}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-300}
      WORKER_LOCK_PATH: /tmp/sentinelayer-maintenance.lock
      BACKUP_DIR: /app/backups
    restart: unless-stopped
