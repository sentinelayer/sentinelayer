groups:
  - name: sentinelayer
    rules:
      - alert: ServiceDown
        expr: up{job="sentinelayer"} == 0
        for: 1m
        annotations:
          summary: "SentinelLayer service is down"
          severity: critical
      
      - alert: HighErrorRate
        expr: rate(sentinelayer_requests_total{status=~"5.."}[5m]) / rate(sentinelayer_requests_total[5m]) > 0.05
        for: 2m
        annotations:
          summary: "High error rate > 5%"
          severity: warning
      
      - alert: WAFBlockSpike
        expr: rate(sentinelayer_waf_blocks_total[5m]) > 10
        for: 2m
        annotations:
          summary: "WAF block spike detected"
          severity: warning
      
      - alert: RateLimitHits
        expr: rate(sentinelayer_rate_limit_hits_total[5m]) > 5
        for: 2m
        annotations:
          summary: "High rate limit hits detected"
          severity: warning
      
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum(rate(sentinelayer_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 3m
        annotations:
          summary: "Slow requests detected (p95 > 2s)"
          severity: warning
      
      - alert: HighActiveRequests
        expr: sentinelayer_active_requests > 50
        for: 2m
        annotations:
          summary: "High active requests > 50"
          severity: warning
      
      - alert: DatabaseDown
        expr: sentinelayer_database_status == 0
        for: 1m
        annotations:
          summary: "Database connection lost"
          severity: critical
      
      - alert: RedisDown
        expr: sentinelayer_redis_status == 0
        for: 1m
        annotations:
          summary: "Redis connection lost"
          severity: critical
      
      - alert: NoActiveTenants
        expr: sentinelayer_tenants_active == 0
        for: 5m
        annotations:
          summary: "No active tenants detected"
          severity: warning
      
      - alert: DiskSpaceLow
        expr: sentinelayer_disk_usage > 80
        for: 5m
        annotations:
          summary: "Disk usage > 80%"
          severity: warning
