groups:
  - name: sentinelayer
    rules:
      - alert: ServiceDown
        expr: up{job="sentinelayer"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SentinelLayer service is down"
          runbook: "docs/OPERATIONS.md#health-and-readiness"

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate > 5%"
          runbook: "docs/OPERATIONS.md#incident-response"

      - alert: WAFBlockSpike
        expr: rate(waf_blocks_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WAF block spike"
          runbook: "docs/OPERATIONS.md#security-monitoring"

      - alert: AuthFailureSpike
        expr: rate(auth_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Authentication failures are elevated"
          runbook: "docs/OPERATIONS.md#incident-response"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Slow requests (p95 > 2s)"
          runbook: "docs/OPERATIONS.md#health-and-readiness"

      - alert: RequestSaturation
        expr: http_requests_active > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Active request saturation is elevated"
          runbook: "docs/OPERATIONS.md#health-and-readiness"
