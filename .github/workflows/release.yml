name: Release
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build gateway binary
        working-directory: gateway
        run: |
          go build -o ../dist/gateway ./cmd/gateway
      - name: Package
        run: |
          mkdir -p dist
          echo "SentinelLayer ${{ github.ref_name }}" > dist/VERSION
          tar -czf sentinelayer-${{ github.ref_name }}.tar.gz dist/ || true
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sentinelayer-*.tar.gz
            dist/gateway
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
