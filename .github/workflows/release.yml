name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (manual)"
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Build gateway binary
        working-directory: gateway
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/gateway ./cmd/gateway
          sha256sum ../dist/gateway | tee ../dist/gateway.sha256

      - name: Package tarball
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          printf 'SentinelLayer %s\n' "$RELEASE_REF" > dist/VERSION
          tar -czf "sentinelayer-${RELEASE_REF}.tar.gz" -C dist .
          sha256sum "sentinelayer-${RELEASE_REF}.tar.gz" | tee dist/tarball.sha256

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9

      - name: Sign artifacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature dist/gateway.sig \
            --output-certificate dist/gateway.pem \
            dist/gateway
          cosign sign-blob --yes \
            --output-signature dist/tarball.sig \
            --output-certificate dist/tarball.pem \
            sentinelayer-*.tar.gz

      - name: Generate SBOM note
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -i requirements.txt -o dist/sbom-python.json

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/gateway
            dist/gateway.sha256
            dist/gateway.sig
            dist/gateway.pem
            dist/tarball.sha256
            dist/tarball.sig
            dist/tarball.pem
            dist/sbom-python.json
            sentinelayer-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
