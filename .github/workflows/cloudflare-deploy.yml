name: Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "Dockerfile"
      - "gateway/**"
      - "control_plane/**"
      - "engine/**"
      - "waf/**"
      - "security/**"
      - "scripts/**"
      - ".github/workflows/cloudflare-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@1e60f620b9541dca0d2c7c25c3f4a3f7af6f7d15
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install Cloudflare dependencies
        run: npm ci
      - name: Deploy Worker and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  missing-credentials:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured; Cloudflare deployment was intentionally skipped."
