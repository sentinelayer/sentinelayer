name: CI
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-test-secret-min-32-chars-xxxxxx
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: |
          pytest tests/unit -v --tb=short \
            --ignore=tests/integration --ignore=tests/load \
            --ignore=tests/resilience --ignore=tests/adversarial
      - name: Behavior + risk unit
        run: pytest tests/unit/test_behavior_engine.py tests/unit/test_risk_engine.py -v --tb=short

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25"
      - name: Build gateway
        working-directory: gateway
        run: go build -o /tmp/gateway-bin ./cmd/gateway

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build Railway image
        run: docker build --tag sentinelayer-ci:${{ github.sha }} .

  security-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: sentinelayer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start control-plane
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinelayer
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-min-32-chars-xxxxxx
          SL_ENV: test
          SL_AUTO_CREATE_SCHEMA: "0"
          PYTHONPATH: .
        run: |
          alembic -c alembic.ini upgrade head
          nohup uvicorn control_plane.app.main:app --host 0.0.0.0 --port 8005 > /tmp/cp.log 2>&1 &
          sleep 5
          curl -sf http://localhost:8005/health || (cat /tmp/cp.log; exit 1)
      - name: BOLA + tenant matrix
        env:
          CONTROL_PLANE_URL: http://localhost:8005
          JWT_SECRET: ci-test-secret-min-32-chars-xxxxxx
        run: |
          pytest tests/test_bola_real.py tests/test_tenant_matrix.py -v --tb=short
      - name: PostgreSQL RLS isolation evidence
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinelayer
          TEST_POSTGRES_RLS: "1"
          JWT_SECRET: ci-test-secret-min-32-chars-xxxxxx
          SL_ENV: test
          PYTHONPATH: .
        run: pytest tests/test_rls_real.py -v --tb=short
      - name: Generate repository GRC evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp security/manifests/runtime-provenance.json evidence/runtime-provenance.json
          git diff --check
          printf '%s\n' 'Repository GRC evidence generated from the reviewed provenance manifest and blocking CI/security checks.' > evidence/README.md
      - name: Upload repository GRC evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-grc-evidence
          path: evidence/
          if-no-files-found: error
