name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-cov bandit safety
      - name: Run tests
        env:
          TESTING: "true"
        run: pytest tests/ -v --cov=src/sentinelayer --cov-report=xml
      - name: Run bandit (FAILS if issues found)
        run: bandit -r src/ -f json -o bandit_report.json
      - name: Run safety check
        run: safety check
