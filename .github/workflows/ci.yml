name: CI
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest tests/unit tests/unit/ -v --tb=short -m "not integration" --ignore=tests/test_bola_real.py --ignore=tests/test_tenant_matrix.py --ignore=tests/test_security_e2e.py --ignore=tests/test_dr.py --ignore=tests/test_dr_real.py --ignore=tests/test_load.py --ignore=tests/integration --ignore=tests/load --ignore=tests/resilience --ignore=tests/adversarial
      - name: Behavior + risk unit
        run: pytest tests/unit/test_behavior_engine.py tests/unit/test_risk_engine.py -v --tb=short

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build gateway
        working-directory: gateway
        run: go build -o /tmp/gateway-bin ./cmd/gateway
