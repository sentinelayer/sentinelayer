name: Security Gate (Machine-Enforced + Omar)
on: [push, pull_request]
jobs:
  security-gate:
    runs-on: ubuntu-latest
    env:
      SENTINELAYER_TOKEN: ${{ secrets.SENTINELAYER_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run SentinelLayer external gate
        if: ${{ env.SENTINELAYER_TOKEN != '' }}
        uses: mrrCarter/sentinelayer-v1-action@b13504565105b2496c5b1dbb7a3e9bf914c2a9f8
        with:
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          scan_mode: deep
          severity_gate: P1
      - name: Report missing external gate token
        if: ${{ env.SENTINELAYER_TOKEN == '' }}
        run: echo "::warning::SENTINELAYER_TOKEN is not configured; local Semgrep/Trivy/pytest gates remain required."
