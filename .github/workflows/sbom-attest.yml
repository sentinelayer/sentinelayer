name: SBOM Attestation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Generate CycloneDX SBOM (Python)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -i requirements.txt -o sbom-python.json
      - name: Generate SBOM note for Go gateway
        working-directory: gateway
        run: |
          if command -v go >/dev/null 2>&1; then
            go version
            go list -m all > ../sbom-go-modules.txt
          fi
          echo "SBOM artifacts generated" > ../sbom-status.txt
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: |
            sbom-python.json
            sbom-go-modules.txt
            sbom-status.txt
          if-no-files-found: error
