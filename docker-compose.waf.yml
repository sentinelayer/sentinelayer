services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sentinelayer
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=test-secret-key-for-testing-only
    depends_on:
      - postgres
      - redis
    networks:
      - sentinelayer-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinelayer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinelayer-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinelayer-network

networks:
  sentinelayer-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
