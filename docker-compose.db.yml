version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelayer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinelayer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinelayer-network

volumes:
  postgres_data:

networks:
  sentinelayer-network:
    driver: bridge
