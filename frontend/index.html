<!DOCTYPE html>
<html>
<head>
    <title>SentinelLayer - Security Platform</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #0a0a0a; color: #fff; }
        .dashboard { max-width: 1200px; margin: 0 auto; }
        h1 { color: #00ff88; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .metric-card { background: #1a1a2e; padding: 20px; border-radius: 8px; border-left: 4px solid #00ff88; }
        .metric-card.warning { border-left-color: #ffaa00; }
        .metric-card.critical { border-left-color: #ff0044; }
        .metric-card h3 { margin: 0; color: #888; font-size: 14px; }
        .metric-card p { margin: 10px 0 0; font-size: 32px; font-weight: bold; }
        .status { text-align: center; margin-top: 40px; color: #00ff88; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>🛡️ SentinelLayer Security Dashboard</h1>
        <div class="metrics-grid">
            <div class="metric-card"><h3>WAF Blocks</h3><p>156</p></div>
            <div class="metric-card warning"><h3>Active Threats</h3><p>3</p></div>
            <div class="metric-card critical"><h3>Auth Failures</h3><p>45</p></div>
            <div class="metric-card"><h3>Risk Score</h3><p>12</p></div>
        </div>
        <div class="status">
            <p>✅ System Status: Operational</p>
            <p style="font-size: 14px; color: #666;">Last updated: $(date)</p>
        </div>
    </div>
</body>
</html>
