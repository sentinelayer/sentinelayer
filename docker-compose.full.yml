version: '3.8'

services:
  api:
    build: .
    container_name: sentinelayer-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sentinelayer
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      - postgres
      - redis
    networks:
      - sentinelayer-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: sentinelayer-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sentinelayer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinelayer-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sentinelayer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sentinelayer-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  sentinelayer-network:
    driver: bridge
