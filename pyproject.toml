[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelayer"
version = "0.1.0"
description = "Security control and enforcement platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pytest>=8,<9",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.1,<3",
  "httpx>=0.27,<1",
  "redis>=5.0,<6",
  "sqlalchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pytest-cov>=5,<6",
  "requests>=2.31,<3",
  "prometheus-client>=0.19,<1",
  "PyJWT>=2.8,<3",
  "python-jose>=3.3,<4",
  "passlib[bcrypt]>=1.7,<2",
  "cryptography>=41.0,<42",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinelayer*"]
exclude = ["tests*", "private*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
