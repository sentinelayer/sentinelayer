[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelayer"
version = "0.1.0"
description = "API Security Platform"
authors = [{name = "SentinelLayer Team", email = "team@sentinelayer.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=41.0.0",
    "pyjwt>=2.10.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.21.0",
    "bcrypt>=4.1.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.18",
    "requests>=2.31.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
sentinel-layer = "control_plane.app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
