version: '3.8'

services:
  k6:
    image: grafana/k6:latest
    container_name: sentinelayer-k6
    volumes:
      - ./tests/load:/scripts
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    command: run /scripts/performance_test.js
    depends_on:
      - influxdb
    networks:
      - sentinelayer-network

  influxdb:
    image: influxdb:2.0
    container_name: sentinelayer-influxdb
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - sentinelayer-network

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelayer-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sentinelayer-network

volumes:
  influxdb_data:
  grafana_data:

networks:
  sentinelayer-network:
    external: true
