openapi: 3.0.0
info:
  title: SentinelLayer Control Plane API
  version: 0.1.0
  description: Control Plane API for SentinelLayer
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                password: {type: string}
                full_name: {type: string}
                tenant_id: {type: string}
      responses:
        200: {description: Success}
  /api/v1/auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        200: {description: Success}
  /api/v1/tenants:
    get:
      summary: List tenants
      responses:
        200: {description: Success}
    post:
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
      responses:
        200: {description: Success}
  /api/v1/policies:
    get:
      summary: List policies
      responses:
        200: {description: Success}
    post:
      summary: Create policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                rules: {type: object}
                application_id: {type: string}
      responses:
        200: {description: Success}
  /api/v1/incidents:
    get:
      summary: List incidents
      responses:
        200: {description: Success}
    post:
      summary: Create incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severity: {type: string}
                description: {type: string}
                tenant_id: {type: string}
      responses:
        200: {description: Success}
  /api/v1/evidence:
    get:
      summary: List evidence
      responses:
        200: {description: Success}
    post:
      summary: Create evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                artifact: {type: string}
                requirement_id: {type: string}
                control_id: {type: string}
      responses:
        200: {description: Success}
  /api/v1/policies/{policy_id}/versions:
    get:
      summary: List immutable policy versions
      responses:
        200: {description: Success}
    post:
      summary: Create a new immutable policy version
      responses:
        200: {description: Success}
  /api/v1/policies/{policy_id}/versions/{version}:
    get:
      summary: Retrieve one policy version
      responses:
        200: {description: Success}
        404: {description: Not found}
  /api/v1/policies/{policy_id}/diff:
    get:
      summary: Compare two policy versions
      parameters:
        - {name: from_version, in: query, required: true, schema: {type: integer}}
        - {name: to_version, in: query, required: true, schema: {type: integer}}
      responses:
        200: {description: Success}
  /api/v1/policies/{policy_id}/rollback/{version}:
    post:
      summary: Restore a prior policy as a new version
      responses:
        200: {description: Success}
  /api/v1/events:
    get:
      summary: List tenant runtime events
      responses:
        200: {description: Success}
    post:
      summary: Record a tenant runtime event
      responses:
        200: {description: Success}
  /api/v1/metrics/security:
    get:
      summary: Aggregate security metrics for a bounded time window
      responses:
        200: {description: Success}
  /api/v1/alerts:
    get:
      summary: List tenant alerts
      responses:
        200: {description: Success}
    post:
      summary: Create a tenant alert
      responses:
        200: {description: Success}
  /api/v1/audit:
    get:
      summary: List immutable tenant audit events
      responses:
        200: {description: Success}
  /api/v1/offboarding/request:
    post:
      summary: Start a confirmed soft or scheduled hard offboarding
      responses:
        200: {description: Success}
  /api/v1/offboarding/status:
    get:
      summary: Read tenant offboarding status
      responses:
        200: {description: Success}
  /api/v1/threat-intel/indicators:
    get:
      summary: List active tenant threat indicators
      responses:
        200: {description: Success}
    post:
      summary: Register a tenant threat indicator with optional TTL
      responses:
        200: {description: Success}
  /api/v1/schemas/{schema_id}/{version}:
    get:
      summary: Retrieve a tenant schema version
      responses:
        200: {description: Success}
  /api/v1/residency/enforce/{data_type}/{region}:
    get:
      summary: Evaluate tenant data residency rule
      responses:
        200: {description: Success}
  /api/v1/webhooks/register:
    post:
      summary: Register a tenant webhook without returning its secret
      responses:
        200: {description: Success}
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      responses:
        200: {description: Success}
        401: {description: Invalid metrics token}
        503: {description: Metrics token is not configured in production}
  /api/v1/gates/requirements:
    get:
      summary: List tenant acceptance requirements
      responses:
        200: {description: Success}
    post:
      summary: Register a tenant acceptance requirement
      responses:
        200: {description: Created}
        409: {description: Requirement already exists}
  /api/v1/gates/requirements/{req_id}/checks:
    patch:
      summary: Update machine check inputs; status is derived only by evaluation
      responses:
        200: {description: Updated}
  /api/v1/gates/requirements/{req_id}/evaluate:
    post:
      summary: Evaluate and persist an immutable acceptance result
      responses:
        200: {description: Evaluated}
  /api/v1/gates/production-ready:
    get:
      summary: Evaluate P0/P1 production readiness for the tenant
      responses:
        200: {description: Readiness result}
  /api/v1/compliance/applicability/evaluate:
    post:
      summary: Evaluate and persist applicable framework obligations
      responses:
        200: {description: Applicability result}
  /api/v1/compliance/applicability/latest:
    get:
      summary: Read the latest tenant applicability decision
      responses:
        200: {description: Decision}
        404: {description: No decision recorded}
  /api/v1/auth/api-keys:
    get:
      summary: List API key metadata without secret material
      responses:
        200: {description: Success}
    post:
      summary: Create a hashed, expiring API key; plaintext returned once
      responses:
        200: {description: Created}
  /api/v1/auth/api-keys/{key_id}/revoke:
    post:
      summary: Revoke an API key
      responses:
        200: {description: Revoked}
  /api/v1/auth/sessions:
    get:
      summary: List current user sessions
      responses:
        200: {description: Success}
  /api/v1/auth/sessions/{session_id}/revoke:
    post:
      summary: Revoke one current user session
      responses:
        200: {description: Revoked}
  /api/v1/behavior/baselines:
    get:
      summary: List tenant behavior baseline versions
      responses:
        200: {description: Success}
    post:
      summary: Create a new tenant behavior baseline version
      responses:
        200: {description: Created}
  /api/v1/behavior/baselines/{baseline_id}/rollback:
    post:
      summary: Roll back a behavior baseline version
      responses:
        200: {description: Rolled back}
  /api/v1/risk/calibrations:
    get:
      summary: List tenant risk calibration versions
      responses:
        200: {description: Success}
    post:
      summary: Create a risk calibration record with dataset hash
      responses:
        200: {description: Created}
  /api/v1/risk/calibrations/{calibration_id}/activate:
    post:
      summary: Activate a prior risk calibration version
      responses:
        200: {description: Activated}
  /api/v1/events/decisions:
    get:
      summary: List persisted tenant risk decisions
      responses:
        200: {description: Success}
  /api/v1/webhooks/logs:
    get:
      summary: List durable webhook delivery attempts
      responses:
        200: {description: Success}
