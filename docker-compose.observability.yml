services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelayer-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - sentinelayer-network

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelayer-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sentinelayer-network

networks:
  sentinelayer-network:
    driver: bridge

volumes:
  grafana_data:
