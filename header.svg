<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1">
        <animate attributeName="stop-color" values="#ff6b6b;#feca57;#48dbfb;#ff6b6b" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#feca57;stop-opacity:1">
        <animate attributeName="stop-color" values="#feca57;#48dbfb;#ff6b6b;#feca57" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#48dbfb;stop-opacity:1">
        <animate attributeName="stop-color" values="#48dbfb;#ff6b6b;#feca57;#48dbfb" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:1">
        <animate attributeName="stop-color" values="#a29bfe;#fd79a8;#00b894;#a29bfe" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00b894;stop-opacity:1">
        <animate attributeName="stop-color" values="#00b894;#a29bfe;#fd79a8;#00b894" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="800" height="250" rx="16" fill="url(#grad1)">
    <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="100" font-family="monospace" font-size="52" fill="#ffffff" text-anchor="middle" font-weight="bold">
    SentinelLayer
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="150" font-family="monospace" font-size="22" fill="#dfe6e9" text-anchor="middle" letter-spacing="2">
    API Security Platform
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <line x1="200" y1="180" x2="600" y2="180" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x1" values="200;400;200" dur="5s" repeatCount="indefinite"/>
  </line>
  <circle cx="150" cy="210" r="8" fill="#ff6b6b">
    <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="210" r="8" fill="#feca57">
    <animate attributeName="r" values="8;12;8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="210" r="8" fill="#48dbfb">
    <animate attributeName="r" values="6;10;6" dur="1.3s" repeatCount="indefinite"/>
  </circle>
</svg>
